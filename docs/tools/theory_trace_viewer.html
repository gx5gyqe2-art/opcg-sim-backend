<title>理論と探索の棋譜</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#f2f4f7; --panel:#ffffff; --ink:#1d2430; --ink-2:#4e5866; --ink-3:#8791a0; --line:#d9dee6;
  --theory:#b8760f; --theory-bg:#fbf1dc; --search:#1e7f87; --search-bg:#dff2f3;
  --bad:#b0303c; --bad-bg:#f9e3e5; --warn:#c48a15; --ok:#3a7d44;
  --fam-play:#3d5cb8; --fam-attack:#b0303c; --fam-attach:#8a5cc7; --fam-effect:#1e7f87; --fam-end:#8791a0;
  --mover:#eaf6f7; --chip:#eef1f5; --focus:#2f6fd6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141922; --panel:#1c2331; --ink:#e7ebf1; --ink-2:#b4bcc8; --ink-3:#7f8998; --line:#2e3746;
    --theory:#e6a83b; --theory-bg:#3a2e14; --search:#4fc0c8; --search-bg:#153538;
    --bad:#ee6b76; --bad-bg:#3d1c21; --warn:#e0b04a; --ok:#6fc07a;
    --fam-play:#8aa4f0; --fam-attack:#ee6b76; --fam-attach:#bd9cf2; --fam-effect:#4fc0c8; --fam-end:#7f8998;
    --mover:#1b2f33; --chip:#262f3d; --focus:#7aa7ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141922; --panel:#1c2331; --ink:#e7ebf1; --ink-2:#b4bcc8; --ink-3:#7f8998; --line:#2e3746;
  --theory:#e6a83b; --theory-bg:#3a2e14; --search:#4fc0c8; --search-bg:#153538;
  --bad:#ee6b76; --bad-bg:#3d1c21; --warn:#e0b04a; --ok:#6fc07a;
  --fam-play:#8aa4f0; --fam-attack:#ee6b76; --fam-attach:#bd9cf2; --fam-effect:#4fc0c8; --fam-end:#7f8998;
  --mover:#1b2f33; --chip:#262f3d; --focus:#7aa7ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px;line-height:1.5}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 32px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding-block:10px 8px}
header .row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em}
.sub{color:var(--ink-3);font-size:12px}
select,button,input[type=file]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}
button:hover{border-color:var(--ink-3)}
button:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--focus);outline-offset:2px}
button.primary{border-color:var(--theory);color:var(--theory);font-weight:500}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-2)}
input[type=range]{width:110px}
.timeline{display:flex;gap:2px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:thin}
.tick{flex:0 0 7px;height:18px;border-radius:2px;background:var(--line);cursor:pointer;border:none;padding:0}
.tick.main{background:var(--ink-3);opacity:.45}
.tick.forb{opacity:1;background:var(--bad)}
.tick.p2{height:12px;align-self:flex-end}
.tick.cur{outline:2px solid var(--focus);outline-offset:1px}
.tick.hid{display:none}
main{display:grid;gap:16px;grid-template-columns:1fr;padding-top:12px}
.list{order:2}.detail{order:1}
@media (min-width:900px){main{grid-template-columns:300px 1fr}.list{order:1}.detail{order:2}}
.list{background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:40vh;overflow:auto}
@media (min-width:900px){.list{max-height:78vh}}
label.chk{max-width:100%;min-width:0}
label.chk select{flex:1 1 160px;min-width:0;max-width:100%;text-overflow:ellipsis}
.list .item{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.list .item:last-child{border-bottom:none}
.list .item:hover{background:var(--chip)}
.list .item.cur{background:var(--search-bg)}
.list .item.forb .mv{color:var(--bad);font-weight:500}
.list .t{color:var(--ink-3);font-size:11px}
.list .s{font-size:11px;color:var(--ink-3)}
.list .s.neg{color:var(--bad);font-weight:500}
.detail{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.verdict{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline}
.verdict .big{font-size:18px;font-weight:700}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;line-height:1.6}
.pill.search{background:var(--search-bg);color:var(--search)}
.pill.theory{background:var(--theory-bg);color:var(--theory)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.ok{background:var(--chip);color:var(--ok)}
.pill.muted{background:var(--chip);color:var(--ink-2)}
.side{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel)}
.side.mover{background:var(--mover);border-color:var(--search)}
.side h3{margin:0 0 6px;font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.side h3 .who{font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2)}
.zone{margin-top:6px}
.zone .zl{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.c{display:inline-flex;gap:5px;align-items:baseline;background:var(--chip);border-radius:5px;padding:2px 7px;font-size:12px;line-height:1.5;max-width:100%}
.c .nm{font-weight:500;overflow-wrap:anywhere}
.c .num{color:var(--ink-3);font-size:11px}
.c.rest{opacity:.6;text-decoration:line-through;text-decoration-color:var(--ink-3)}
.c.leader{border:1px solid var(--line);background:transparent}
.c .don{color:var(--fam-attach);font-weight:500}
.c .kw{color:var(--ink-3);font-size:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;color:var(--ink-3);font-weight:500;letter-spacing:.05em}
td.num,th.num{text-align:right}
tr.chosen td{background:var(--search-bg)}
tr.best td{box-shadow:inset 3px 0 0 var(--theory)}
tr.chosen.best td{background:var(--theory-bg)}
.fam{display:inline-block;font-size:11px;border-radius:4px;padding:0 6px;color:#fff;line-height:1.7}
.fam.play{background:var(--fam-play)}.fam.attack{background:var(--fam-attack)}.fam.attach{background:var(--fam-attach)}.fam.effect{background:var(--fam-effect)}.fam.end{background:var(--fam-end)}.fam.other{background:var(--ink-3)}
.marks{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.tbl{overflow-x:auto}
.ev{font-size:12px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 10px}
.ev span{background:var(--chip);border-radius:4px;padding:1px 7px}
.legend{font-size:12px;color:var(--ink-2)}
.legend dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:8px 0 0}
.legend dt{font-weight:500;color:var(--ink)}
.legend dd{margin:0}
.empty{padding:28px;text-align:center;color:var(--ink-3)}
.nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--chip)}
@media (prefers-reduced-motion:no-preference){.list .item,tr td{transition:background .12s}}
</style>

<div class="wrap">
<header class="bar">
  <div class="row">
    <h1>理論と探索の棋譜</h1>
    <span class="sub" id="meta"></span>
  </div>
  <div class="row" style="margin-top:6px">
    <label class="chk">局 <select id="game"></select></label>
    <div class="nav">
      <button id="prev" title="前の決定点（←）">← 前</button>
      <button id="next" title="次の決定点（→）">次 →</button>
      <button id="nextforb" class="primary" title="次の食い違い（f）">次の食い違い</button>
    </div>
    <label class="chk"><input type="checkbox" id="onlyMain" checked> 決定点だけ</label>
    <label class="chk"><input type="checkbox" id="onlyForb"> 食い違いだけ</label>
    <label class="chk">差 ≥ <span class="mono" id="thrv">0.0</span> 枚 <input type="range" id="thr" min="0" max="4" step="0.25" value="0"></label>
    <label class="chk">JSON を開く <input type="file" id="file" accept=".json,application/json"></label>
  </div>
  <div class="timeline" id="timeline" aria-label="決定点の並び"></div>
</header>

<main>
  <aside class="list" id="list" aria-label="決定点の一覧"></aside>
  <section class="detail" id="detail"></section>
</main>

<section class="card legend" style="margin-top:16px">
  <strong>読み方</strong>
  <dl>
    <dt>探索</dt><dd>CPU（MCTS）が実際に打った手。候補表では <span class="pill search">探索</span>、n は訪問数、q は探索の平均価値。</dd>
    <dt>理論</dt><dd>同じ候補を理論の価格式で値付けした値。単位は「手札 1 枚ぶんの価値」（枚）。候補表で最も高い手が <span class="pill theory">理論の最善</span>。</dd>
    <dt>差</dt><dd>打った手の価格 − 理論の最善の価格。負なら理論は打った手を損と読んでいる（<span class="pill bad">食い違い</span>）。大きさは手札何枚ぶんか。</dd>
    <dt>付与の読み</dt><dd>ドンを付けるだけの手は「その札がこのターンに最終的に何枚乗せて殴る攻撃」の価格で読む（実行の折り返し先を「→ #番号」で示す）。</dd>
    <dt>盤面</dt><dd>完全情報で表示（両席の手札の中身が見える）。手番側の枠が色つき。取り消し線はレスト。</dd>
  </dl>
</section>
</div>

<script type="application/json" id="trace-data">/*__TRACE_DATA__*/null</script>
<script>
(function(){
  const $ = s => document.querySelector(s);
  let DATA = null, gi = 0, di = 0;
  const famJp = {play:"出す", attack:"攻撃", attach:"付与", effect:"効果", end:"終了"};
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const fmt = (v, d=2) => (v === null || v === undefined || Number.isNaN(v)) ? "—" : Number(v).toFixed(d);

  function load(obj){
    DATA = obj; gi = 0; di = 0;
    try{ const s = JSON.parse(localStorage.getItem("ttv-pos")||"null"); if (s && s.seed_base === obj.meta?.seed_base && s.gi < obj.games.length){ gi = s.gi; di = s.di; } }catch(e){}
    const m = obj.meta || {};
    $("#meta").textContent = `${obj.games.length} 局・読み ${m.seq||"?"}・sims ${m.sims||"?"}・${m.decks||""}${m.summary ? `・決定点 ${m.summary.n_main} のうち食い違い ${m.summary.n_forbidden}（${Math.round((m.summary.forbid_rate||0)*100)}%）` : ""}`;
    const g = $("#game"); g.innerHTML = "";
    obj.games.forEach((G, i) => {
      const b = G.decisions[0]?.board; const n1 = b?.p1?.leader?.name || G.leaders?.p1, n2 = b?.p2?.leader?.name || G.leaders?.p2;
      const nf = G.decisions.filter(d => d.forbidden).length;
      const o = document.createElement("option"); o.value = i; o.textContent = `#${G.seed}  ${n1} vs ${n2}  勝者 ${G.winner||"—"}  食い違い ${nf}`; g.appendChild(o);
    });
    g.value = gi; render();
  }
  function visible(d){
    if ($("#onlyMain").checked && d.kind !== "main") return false;
    if ($("#onlyForb").checked && !d.forbidden) return false;
    const thr = parseFloat($("#thr").value);
    if (thr > 0 && !(d.s_mu !== null && d.s_mu !== undefined && -d.s_mu >= thr)) return false;
    return true;
  }
  function save(){ try{ localStorage.setItem("ttv-pos", JSON.stringify({seed_base: DATA.meta?.seed_base, gi, di})); }catch(e){} }

  function render(){
    if (!DATA){ $("#detail").innerHTML = `<div class="card empty">上の「JSON を開く」から theory_trace.py の出力を選んでください。</div>`; return; }
    const G = DATA.games[gi]; const D = G.decisions;
    if (di >= D.length) di = 0;
    // timeline
    const tl = $("#timeline"); tl.innerHTML = "";
    D.forEach((d, i) => {
      const b = document.createElement("button");
      b.className = "tick" + (d.kind === "main" ? " main" : "") + (d.forbidden ? " forb" : "") + (d.seat === "p2" ? " p2" : "") + (i === di ? " cur" : "") + (visible(d) ? "" : " hid");
      b.title = `T${d.turn} ${d.seat} ${d.move}${d.s_mu != null ? ` 差 ${fmt(d.s_mu)}` : ""}`;
      b.addEventListener("click", () => { di = i; render(); });
      tl.appendChild(b);
    });
    // list
    const list = $("#list"); list.innerHTML = "";
    D.forEach((d, i) => {
      if (!visible(d)) return;
      const it = document.createElement("div");
      it.className = "item" + (i === di ? " cur" : "") + (d.forbidden ? " forb" : "");
      it.innerHTML = `<div class="t">T${d.turn}<br>${d.seat}</div><div class="mv">${esc(d.move)}</div><div class="s mono ${d.s_mu < -1e-9 ? "neg" : ""}">${d.s_mu != null ? fmt(d.s_mu) : ""}</div>`;
      it.addEventListener("click", () => { di = i; render(); });
      list.appendChild(it);
    });
    const cur = list.querySelector(".item.cur"); if (cur) cur.scrollIntoView({block:"nearest"});
    const ct = tl.querySelector(".tick.cur"); if (ct) ct.scrollIntoView({inline:"center", block:"nearest"});
    renderDetail(G, D[di]);
    save();
  }

  function side(b, seat, G, d){
    const s = b[seat]; const mover = d.seat === seat;
    const chip = (c, hand) => {
      if (!c) return "";
      const num = hand ? `<span class="num">${c.cost ?? "-"}c/${c.power ?? "-"}${c.counter ? `/C${c.counter}` : ""}</span>`
                       : `<span class="num">${c.power ?? "-"}${c.cost != null && c.cost !== 0 ? ` ${c.cost}c` : ""}</span>${c.don ? `<span class="don">+${c.don}D</span>` : ""}${c.kw ? `<span class="kw">${esc(c.kw.join(" "))}</span>` : ""}`;
      return `<span class="c${c.rest ? " rest" : ""}"><span class="nm">${esc(c.name)}</span>${num}</span>`;
    };
    const L = s.leader ? `<span class="c leader${s.leader.rest ? " rest" : ""}"><span class="nm">${esc(s.leader.name)}</span><span class="num">${s.leader.power}</span>${s.leader.don ? `<span class="don">+${s.leader.don}D</span>` : ""}</span>` : "";
    return `<div class="side${mover ? " mover" : ""}">
      <h3><span class="who">${seat}${mover ? "（手番）" : ""}</span>${L}${G.winner === seat ? `<span class="pill ok">勝者</span>` : ""}</h3>
      <div class="stats mono"><span>ライフ ${s.life}</span><span>ドン 起 ${s.don_active}／休 ${s.don_rested}／山 ${s.don_deck}</span><span>山札 ${s.deck}</span><span>トラッシュ ${s.trash}</span>${s.stage ? `<span>ステージ ${esc(s.stage)}</span>` : ""}</div>
      <div class="zone"><div class="zl">場 ${s.field.length}</div><div class="chips">${s.field.map(c => chip(c,false)).join("") || "<span class='sub'>なし</span>"}</div></div>
      <div class="zone"><div class="zl">手札 ${s.hand.length}</div><div class="chips">${s.hand.map(c => chip(c,true)).join("") || "<span class='sub'>なし</span>"}</div></div>
    </div>`;
  }

  function renderDetail(G, d){
    if (!d){ $("#detail").innerHTML = `<div class="card empty">決定点がありません。</div>`; return; }
    const opp = d.seat === "p1" ? "p2" : "p1";
    let verdict = "";
    if (d.kind === "main" && d.cands){
      const best = d.best != null ? d.cands[d.best] : null;
      const chosen = d.chosen != null ? d.cands[d.chosen] : null;
      const agree = d.best != null && d.best === d.chosen;
      verdict = `<div class="card"><div class="verdict">
        <span class="pill search">探索</span><span class="big">${esc(chosen ? chosen.d : d.move)}</span>
        ${best && !agree ? `<span class="pill theory">理論の最善</span><span class="big">${esc(best.d)}</span>` : ""}
        ${d.s_mu != null ? (d.forbidden ? `<span class="pill bad">食い違い 差 <span class="mono">${fmt(d.s_mu)}</span> 枚</span>` : `<span class="pill ok">一致（差 <span class="mono">${fmt(d.s_mu)}</span>）</span>`) : `<span class="pill muted">判定なし（値付けできる候補が 2 本未満）</span>`}
      </div></div>`;
    } else {
      verdict = `<div class="card"><div class="verdict"><span class="pill muted">${d.kind === "window" ? "対話の窓（守り・効果の選択）" : d.kind === "commit" ? "箱の続き（機械実行）" : esc(d.kind)}</span><span class="big">${esc(d.move)}</span></div></div>`;
    }
    const head = `<div class="sub">決定点 ${d.i+1}／${G.decisions.length}・ターン ${d.turn}・${esc(d.phase||"")}・局 #${G.seed}</div>`;
    const board = `<div style="display:grid;gap:8px">${side(d.board, opp, G, d)}${side(d.board, d.seat, G, d)}</div>`;
    let table = "";
    if (d.kind === "main" && d.cands){
      const order = d.cands.map((c, i) => i).sort((a, b) => {
        const pa = d.cands[a].p, pb = d.cands[b].p;
        if (pa == null && pb == null) return 0; if (pa == null) return 1; if (pb == null) return -1; return pb - pa;
      });
      const rows = order.map(i => {
        const c = d.cands[i];
        const marks = [];
        if (i === d.chosen) marks.push(`<span class="pill search">探索</span>`);
        if (i === d.best) marks.push(`<span class="pill theory">理論の最善</span>`);
        const src = (c.src != null && c.src !== i) ? `<span class="sub">→ 実行は #${c.src+1}</span>` : "";
        return `<tr class="${i === d.chosen ? "chosen" : ""} ${i === d.best ? "best" : ""}">
          <td class="mono num">${i+1}</td>
          <td><div>${esc(c.d)}</div><div class="marks">${marks.join("")}${src}</div></td>
          <td><span class="fam ${famJp[c.fam] ? c.fam : "other"}">${famJp[c.fam] || esc(c.fam)}</span></td>
          <td class="mono num">${c.p == null ? "—" : fmt(c.p)}</td>
          <td class="mono num">${c.n == null ? "—" : Math.round(c.n)}</td>
          <td class="mono num">${fmt(c.q, 3)}</td></tr>`;
      }).join("");
      table = `<div class="card"><div class="tbl"><table><thead><tr><th class="num">#</th><th>候補の手</th><th>型</th><th class="num">理論（枚）</th><th class="num">探索 n</th><th class="num">q</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    }
    const ev = d.events && d.events.length ? `<div class="card"><div class="zl sub" style="margin-bottom:4px">打った後に起きたこと</div><div class="ev">${d.events.map(e => `<span>${esc(e)}</span>`).join("")}</div></div>` : "";
    $("#detail").innerHTML = head + verdict + board + table + ev;
  }

  function step(dir){
    if (!DATA) return; const D = DATA.games[gi].decisions;
    for (let i = di + dir; i >= 0 && i < D.length; i += dir){ if (visible(D[i])) { di = i; render(); return; } }
  }
  function nextForb(){
    if (!DATA) return; const D = DATA.games[gi].decisions;
    for (let i = di + 1; i < D.length; i++){ if (D[i].forbidden && visible(D[i])) { di = i; render(); return; } }
    for (let i = 0; i <= di; i++){ if (D[i].forbidden && visible(D[i])) { di = i; render(); return; } }
  }
  $("#prev").addEventListener("click", () => step(-1));
  $("#next").addEventListener("click", () => step(1));
  $("#nextforb").addEventListener("click", nextForb);
  $("#game").addEventListener("change", e => { gi = parseInt(e.target.value, 10); di = 0; render(); });
  ["onlyMain","onlyForb"].forEach(id => $("#"+id).addEventListener("change", render));
  $("#thr").addEventListener("input", e => { $("#thrv").textContent = Number(e.target.value).toFixed(1); render(); });
  $("#file").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => { try { load(JSON.parse(r.result)); } catch(err) { $("#detail").innerHTML = `<div class="card empty">JSON を読めませんでした: ${esc(err.message)}</div>`; } }; r.readAsText(f);
  });
  document.addEventListener("keydown", e => {
    if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1); else if (e.key === "f") nextForb();
  });
  const embedded = JSON.parse(document.getElementById("trace-data").textContent.replace(/^\s*\/\*__TRACE_DATA__\*\//, "") || "null");
  if (embedded) load(embedded); else render();
})();
</script>
